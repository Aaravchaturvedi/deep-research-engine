upstream backend {
  server backend:5000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # REST API + auth refresh (cookie-based, same-origin through here)
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO (polling + websocket) — long timeouts for research jobs
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location = /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }

  # Frontend SPA
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Never cache the entry HTML: it references hashed assets, so a stale
  # index.html would keep booting an outdated bundle after each deploy
  # (e.g. showing the old always-on research stepper).
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
}
